
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Login</title>
<style>
body{font-family:Arial;background:#eef3f9;display:grid;place-items:center;min-height:100vh;margin:0}
form{background:white;padding:30px;border-radius:12px;width:300px;max-width:85%}
input,button{box-sizing:border-box;width:100%;padding:12px;margin:9px 0}
button{background:#0876cf;color:white;border:0;border-radius:6px}
</style>
</head>
<body>
<form method="POST">
<h2>Admin Login</h2>
{% with messages = get_flashed_messages(with_categories=true) %}
{% for category, message in messages %}
<p>{{ message }}</p>
{% endfor %}
{% endwith %}
<input name="username" placeholder="Username" required>
<input name="password" type="password" placeholder="Password" required>
<button type="submit">Login</button>
<a href="{{ url_for('index') }}">Back to Website</a>
</form>
</body>
</html>
